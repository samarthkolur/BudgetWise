# Local PostgreSQL. Nothing else is needed to run BudgetWise end to end.
#
#   docker compose up -d
#
# No authentication beyond the password in this file is configured, and that
# is deliberate: the port is bound to loopback only, so nothing off this
# machine can reach it. A stronger credential here would live in this file,
# in git, next to the thing it protects — security theatre.
services:
  postgres:
    image: postgres:16
    container_name: budgetwise_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budgetwise
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
