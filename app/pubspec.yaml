name: budgetwise
description: "BudgetWise — a personal finance companion built on Earn → Save → Invest → Spend."
publish_to: "none"
version: 0.1.0

# Pinned to the Dart shipped with Flutter 3.35.6. Several packages in this tree
# (riverpod_lint, riverpod_generator, the newest json_serializable) require Dart
# >= 3.12 and are deliberately held back rather than upgrading the machine's
# global Flutter, which other projects on this host share. Raise the floor and
# the held-back constraints together, never one alone.
environment:
  sdk: ^3.9.2

# Sorted alphabetically (sort_pub_dependencies). What each group is for:
#   http + flutter_secure_storage  — the API client and its session tokens
#   flutter_riverpod + go_router      — state and routing
#   excel / csv / pdf / share_plus    — the PRD's Excel-replacement exports
#   sqflite + uuid                    — local-first storage, no server required
dependencies:
  budgetwise_domain:
    path: ../packages/budgetwise_domain
  collection: ^1.19.1
  csv: ^6.0.0
  excel: ^4.0.6
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  share_plus: ^12.0.2
  sqflite: ^2.4.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  # In-memory SQLite for testing the local repositories without a device —
  # the same pattern flutter_secure_storage's tests would need for a real
  # backend, applied to sqflite.
  sqflite_common_ffi: ^2.3.4+4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true

  # Space Grotesk + Work Sans, bundled rather than fetched at runtime through
  # google_fonts, for the same reason Geist was: a finance app that shows the
  # wrong typeface until the network answers is worse than a few hundred KB of
  # APK. Space Grotesk carries numbers, headings and buttons; Work Sans carries
  # body copy and captions — see core/theme/app_typography.dart. Static weight
  # instances were extracted from Google Fonts' variable-font source with
  # fonttools (`varLib.instancer`), since discrete static files are no longer
  # published upstream.
  #
  # SIL Open Font License 1.1 (Google). assets/fonts/OFL.txt ships with them.
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Work Sans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
