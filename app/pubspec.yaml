name: budgetwise
description: "BudgetWise — a personal finance companion built on Earn → Save → Invest → Spend."
publish_to: "none"
version: 0.1.0

# Pinned to the Dart shipped with Flutter 3.35.6. Several packages in this tree
# (riverpod_lint, riverpod_generator, the newest json_serializable) require Dart
# >= 3.12 and are deliberately held back rather than upgrading the machine's
# global Flutter, which other projects on this host share. Raise the floor and
# the held-back constraints together, never one alone.
environment:
  sdk: ^3.9.2

# Sorted alphabetically (sort_pub_dependencies). What each group is for:
#   http + flutter_secure_storage  — the API client and its session tokens
#   flutter_riverpod + go_router      — state and routing
#   excel / csv / pdf / share_plus    — the PRD's Excel-replacement exports
#   sqflite + uuid                    — local-first storage, no server required
#   connectivity_plus                 — detects reconnection for the offline
#                                       sync-now prompt, core/sync/
dependencies:
  budgetwise_domain:
    path: ../packages/budgetwise_domain
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  csv: ^6.0.0
  excel: ^4.0.6
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  flutter_sms_inbox: ^1.0.5
  go_router: ^17.2.3
  http: ^1.6.0
  intl: ^0.20.3
  path: ^1.9.0
  path_provider: ^2.1.5
  pdf: ^3.12.0
  permission_handler: ^13.0.2
  share_plus: ^12.0.2
  sqflite: ^2.4.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  # In-memory SQLite for testing the local repositories without a device —
  # the same pattern flutter_secure_storage's tests would need for a real
  # backend, applied to sqflite.
  sqflite_common_ffi: ^2.3.4+4
  very_good_analysis: ^9.0.0

flutter:
  uses-material-design: true

  # Archivo + Inter + IBM Plex Mono, bundled rather than fetched at runtime
  # through google_fonts, for the same reason the superseded Space Grotesk /
  # Work Sans pair was: a finance app that shows the wrong typeface until the
  # network answers is worse than a few hundred KB of APK. Archivo (heavy
  # weights only) carries the monumental figures, screen titles and buttons;
  # Inter carries body copy, labels and captions; IBM Plex Mono carries
  # tabular ledger amounts — see core/theme/app_typography.dart and the
  # "Obsidian" entry in CLAUDE.md's design system section for why. Archivo
  # and Inter ship upstream only as variable fonts, so static weight
  # instances were extracted with fonttools (`varLib.instancer`), same
  # technique as before; IBM Plex Mono publishes static weights directly.
  #
  # SIL Open Font License 1.1 (Google), one family per section.
  # assets/fonts/OFL.txt ships with them.
  fonts:
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Archivo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Archivo-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Archivo-Black.ttf
          weight: 900
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600

dependency_overrides:
  permission_handler_android: 13.0.1

# The app icon: a lime (primary) rupee mark on the near-black Obsidian
# canvas, in the same Archivo Black the rest of the app sets its hero
# figures in — see core/theme/app_theme.dart for both colours. Regenerate
# with `dart run flutter_launcher_icons` after editing anything in
# assets/icon/.
flutter_launcher_icons:
  image_path: "assets/icon/icon_default.png"
  android: true
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: "assets/icon/icon_adaptive_fg.png"
  ios: true
  remove_alpha_ios: true
