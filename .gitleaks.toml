title = "BudgetWise secret scanning"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Rules the defaults do not cover, for the credential shapes this project
# actually handles.
# ---------------------------------------------------------------------------

[[rules]]
id = "supabase-service-role-jwt"
description = "Supabase service_role key (bypasses RLS entirely)"
# A service-role JWT is a normal JWT whose payload carries the role claim. It
# is the single most damaging credential in this project: it ignores every
# policy in supabase/migrations, so a leak is a full data breach rather than a
# rotation chore. It belongs in Edge Function secrets and nowhere else.
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]*(c2VydmljZV9yb2xl|InNlcnZpY2Vfcm9sZSI)[A-Za-z0-9_-]*\.[A-Za-z0-9_-]{10,}'''
keywords = ["eyj", "service_role"]

[[rules]]
id = "mongodb-connection-string"
description = "MongoDB connection string with inline credentials"
# mongodb+srv://user:password@cluster.mongodb.net — the password is right there
# in the URI, which is what makes this shape so easy to paste into a commit.
# Excludes angle-bracket placeholders (<user>:<password>@<cluster>), which is
# how the shape is documented in .env.example — a rule that flags its own
# documentation is a rule people learn to ignore.
# Non-capturing group: gitleaks reports the first capture group as "the
# secret", so a capturing (\+srv) made the finding literally the string "+srv"
# — which no allowlist could usefully match and which told a reader nothing.
regex = '''mongodb(?:\+srv)?:\/\/[^:\/\s<>]+:[^@\/\s<>]+@[^\s'"<>]+'''
keywords = ["mongodb://", "mongodb+srv://"]

[[rules]]
id = "supabase-access-token"
description = "Supabase personal access token"
regex = '''sbp_[a-f0-9]{40,}'''
keywords = ["sbp_"]

[[rules]]
id = "google-oauth-client-secret"
description = "Google OAuth client secret"
# The web client secret belongs in the Supabase dashboard only. The Android and
# iOS client IDs are not secrets and are expected in app/config/*.json.
regex = '''GOCSPX-[a-zA-Z0-9_-]{20,}'''
keywords = ["gocspx-"]

[[rules]]
id = "google-oauth-client-secret-json"
description = "Google client_secret.json contents"
regex = '''"client_secret"\s*:\s*"[a-zA-Z0-9_-]{16,}"'''
keywords = ["client_secret"]

[[rules]]
id = "android-keystore-password"
description = "Android signing credential in a properties file"
regex = '''(?i)(storePassword|keyPassword|keyAlias)\s*=\s*['"]?[^\s'"$#]{6,}'''
keywords = ["storepassword", "keypassword"]

[allowlist]
description = "Paths and shapes that are not secrets"

paths = [
  # Local environment config. The working-tree scan (`gitleaks detect --no-git`)
  # walks the filesystem and does not consult .gitignore, so without this the
  # gate fails on every machine that has a filled-in config — and a gate that
  # always fails is a gate people stop reading.
  #
  # "config must never be tracked" is a different question from "config must not
  # contain secrets", and it is owned by the pre-push hook, which fails on the
  # file being tracked at all regardless of contents. Both arms are needed;
  # neither substitutes for the other.
  '''app/config/dev\.json''',
  '''app/config/staging\.json''',
  '''app/config/prod\.json''',
  '''app/android/key\.properties''',
  '''app/ios/Runner/GoogleService-Info\.plist''',
  '''app/android/app/google-services\.json''',

  # Lockfiles are full of base64-looking hashes.
  '''app/pubspec\.lock''',

  # `android-keystore-password`'s rule captures just the field name
  # (`keyAlias`/`keyPassword`/`storePassword`) as its "secret", by construction
  # of its own regex — so it cannot be allowlisted by value or shape, only by
  # path. That's fine here: this file only ever reads those three values out of
  # the gitignored `key.properties` (`keyAlias = keystoreProperties["keyAlias"]
  # as String`), and structurally cannot contain a literal credential — unlike
  # the value-based entries above, a real password hardcoded into this file
  # would need its own, different rule to catch, not this allowlist entry.
  '''app/android/app/build\.gradle\.kts''',
]

regexes = [
  # The fake Atlas URI in server/test/dev_login_test.dart. That suite has to
  # contain a credential-SHAPED string to prove the dev-login guard rejects
  # non-local databases — a test for "we refuse Atlas" cannot avoid naming
  # something that looks like Atlas.
  #
  # Allowlisted by the exact fake value rather than by allowlisting the test
  # directory: a genuine connection string pasted into a test would still be
  # caught, which is the property that matters.
  '''mongodb\+srv://user:pw@cluster0\.abc\.mongodb\.net''',

  # Placeholder values in the committed example config. Enumerated rather than
  # allowlisting example.json wholesale, so a real value pasted into it is still
  # caught.
  '''YOUR_[A-Z_]+_HERE''',
  '''<[a-z-]+>\.supabase\.co''',
  '''\.apps\.googleusercontent\.com''',

  # The test fixtures' UUIDs.
  '''[0-9]{8}-[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{12}''',

  # The CI-only JWT_SECRET placeholder in .github/workflows/ci.yaml. The
  # server refuses to start below 32 characters (non-negotiable rule 4), so
  # the throwaway Postgres job needs *some* 32+ char value — this exact
  # string, not a real secret. Allowlisted by exact value, same reasoning as
  # the fake Atlas URI above: a real secret pasted in its place would still
  # be caught.
  '''ci-test-secret-at-least-32-characters-long''',
]
