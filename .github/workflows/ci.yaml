name: CI

on:
  push:
    branches: [main]
  pull_request:

# The hooks in .githooks are convenience. This is the gate: everything here runs
# unconditionally, so `git commit --no-verify` defers a failure rather than
# avoiding one.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match the floor in app/pubspec.yaml. Raise both together, never
  # one alone — several dependencies are held back for exactly this reason.
  FLUTTER_VERSION: "3.35.6"

jobs:
  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed --output=none .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Test
        run: flutter test --coverage --reporter=expanded

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: app/coverage/lcov.info

  database:
    name: Database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Proves the migrations build a working schema from empty, then runs both
      # SQL suites. The RLS half is the one that matters: there is no API tier
      # between the client and Postgres, so a gap is every user's financial
      # history readable by every other user.
      - name: Migrations and SQL suites
        run: ./scripts/test_db.sh

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not just this commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      # A separate question from "does it contain a secret": environment config
      # must not be tracked at all, whatever is in it.
      - name: No tracked environment config
        run: |
          tracked=$(git ls-files -- 'app/config/*.json' | grep -v 'app/config/example.json' || true)
          if [ -n "$tracked" ]; then
            echo "::error::environment config is tracked: $tracked"
            exit 1
          fi

  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit messages
        run: |
          fail=0
          while read -r sha; do
            msg=$(git log -1 --format=%s "$sha")
            printf '%s\n' "$msg" > /tmp/msg
            if ! .githooks/commit-msg /tmp/msg; then fail=1; fi
          done < <(git rev-list "origin/${{ github.base_ref }}..HEAD")
          exit $fail

      # Applied migrations are immutable. Editing one means the database
      # everyone else already built no longer matches the file claiming to have
      # built it.
      - name: Migrations are forward-only
        run: |
          modified=$(git diff --diff-filter=M --name-only \
            "origin/${{ github.base_ref }}...HEAD" -- 'supabase/migrations/*.sql' || true)
          if [ -n "$modified" ]; then
            echo "::error::applied migrations were modified: $modified"
            exit 1
          fi

      - name: No placeholders in app code
        run: |
          if grep -rnE '(TODO: implement|FIXME|throw UnimplementedError)' app/lib; then
            echo "::error::placeholder found in app code"
            exit 1
          fi

  build:
    name: Android build
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Config is not committed, so CI supplies placeholder values. This proves
      # the project compiles; it does not prove it can reach Supabase.
      - name: Build debug APK
        working-directory: app
        run: |
          mkdir -p config
          cat > config/ci.json <<'JSON'
          {
            "SUPABASE_URL": "https://ci-placeholder.supabase.co",
            "SUPABASE_ANON_KEY": "ci-placeholder-anon-key",
            "GOOGLE_WEB_CLIENT_ID": "ci-placeholder.apps.googleusercontent.com",
            "GOOGLE_IOS_CLIENT_ID": "ci-placeholder.apps.googleusercontent.com"
          }
          JSON
          flutter pub get
          flutter build apk --debug --dart-define-from-file=config/ci.json
