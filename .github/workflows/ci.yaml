name: CI

on:
  push:
    branches: [main]
  pull_request:

# The hooks in .githooks are convenience. This is the gate: everything here runs
# unconditionally, so `git commit --no-verify` defers a failure rather than
# avoiding one.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match the floor in app/pubspec.yaml. Raise both together, never
  # one alone — several dependencies are held back for exactly this reason.
  FLUTTER_VERSION: "3.35.6"

jobs:
  domain:
    name: Shared domain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/budgetwise_domain
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --set-exit-if-changed --output=none .
      - run: dart analyze --fatal-infos
      # The money arithmetic both the app and the server depend on. If this
      # fails, nothing above it is worth running.
      - run: dart test

  server:
    name: Server
    runs-on: ubuntu-latest
    needs: [domain]
    defaults:
      run:
        working-directory: server
    services:
      mongo:
        image: mongo:7
        ports: ["27018:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --set-exit-if-changed --output=none .
      - run: dart analyze --fatal-infos

      # The isolation suite is the one that matters. MongoDB enforces no
      # ownership rules, so cross-user separation is exactly as good as these
      # assertions and nothing more.
      - name: Tests (isolation + behaviour)
        run: dart test
        env:
          MONGO_TEST_URI: mongodb://localhost:27018

  app:
    name: App
    runs-on: ubuntu-latest
    needs: [domain]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed --output=none .
      - run: flutter analyze --fatal-infos --fatal-warnings
      - run: flutter test

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, not just this commit

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

      # A separate question from "does it contain a secret": credentials must
      # not be tracked at all, whatever is in them.
      - name: No tracked credentials
        run: |
          tracked=$(git ls-files -- 'app/config/*.json' 'server/.env' '*credentials*.env' \
            | grep -v 'app/config/example.json' || true)
          if [ -n "$tracked" ]; then
            echo "::error::credentials are tracked: $tracked"
            exit 1
          fi

  conventions:
    name: Conventions
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit messages
        run: |
          fail=0
          while read -r sha; do
            git log -1 --format=%s "$sha" > /tmp/msg
            if ! .githooks/commit-msg /tmp/msg; then fail=1; fi
          done < <(git rev-list "origin/${{ github.base_ref }}..HEAD")
          exit $fail

      - name: No placeholders in app code
        run: |
          if grep -rnE '(TODO: implement|FIXME|throw UnimplementedError)' app/lib server/lib; then
            echo "::error::placeholder found in shipped code"
            exit 1
          fi

  build:
    name: Android build
    runs-on: ubuntu-latest
    needs: [app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Config is not committed, so CI supplies placeholder values. This proves
      # the project compiles; it does not prove it can reach the API.
      - name: Build debug APK
        working-directory: app
        run: |
          mkdir -p config
          cat > config/ci.json <<'JSON'
          {
            "API_BASE_URL": "http://ci-placeholder.invalid",
            "GOOGLE_WEB_CLIENT_ID": "ci-placeholder.apps.googleusercontent.com",
            "GOOGLE_IOS_CLIENT_ID": "ci-placeholder.apps.googleusercontent.com"
          }
          JSON
          flutter pub get
          flutter build apk --debug --dart-define-from-file=config/ci.json
